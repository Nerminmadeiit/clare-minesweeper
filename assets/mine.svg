<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Claré mine: a faceted ice crystal with eight sharp shards.
       Light facets (#F5F3EF) and shaded facets (#A6BDCC) give it depth. -->
  <defs>
    <!-- One shard, split into a lit half and a shaded half -->
    <g id="shard">
      <polygon points="32,3 32,22 29,22" fill="#F5F3EF" fill-opacity="0.92"/>
      <polygon points="32,3 35,22 32,22" fill="#A6BDCC" fill-opacity="0.8"/>
    </g>
  </defs>

  <!-- Shards: long ones straight, shorter ones on the diagonals -->
  <use href="#shard"/>
  <use href="#shard" transform="rotate(90 32 32)"/>
  <use href="#shard" transform="rotate(180 32 32)"/>
  <use href="#shard" transform="rotate(270 32 32)"/>
  <use href="#shard" transform="rotate(45 32 32) translate(32 32) scale(0.8) translate(-32 -32)"/>
  <use href="#shard" transform="rotate(135 32 32) translate(32 32) scale(0.8) translate(-32 -32)"/>
  <use href="#shard" transform="rotate(225 32 32) translate(32 32) scale(0.8) translate(-32 -32)"/>
  <use href="#shard" transform="rotate(315 32 32) translate(32 32) scale(0.8) translate(-32 -32)"/>

  <!-- Faceted core: light comes from the top left -->
  <g stroke="#F5F3EF" stroke-opacity="0.6" stroke-width="0.6" stroke-linejoin="round">
    <polygon points="32,32 27.41,20.91 36.59,20.91" fill="#F5F3EF" fill-opacity="0.95"/>
    <polygon points="32,32 20.91,27.41 27.41,20.91" fill="#F5F3EF" fill-opacity="0.82"/>
    <polygon points="32,32 36.59,20.91 43.09,27.41" fill="#DCE6ED" fill-opacity="0.8"/>
    <polygon points="32,32 20.91,36.59 20.91,27.41" fill="#C9D8E2" fill-opacity="0.75"/>
    <polygon points="32,32 43.09,27.41 43.09,36.59" fill="#A6BDCC" fill-opacity="0.8"/>
    <polygon points="32,32 27.41,43.09 20.91,36.59" fill="#A6BDCC" fill-opacity="0.68"/>
    <polygon points="32,32 43.09,36.59 36.59,43.09" fill="#7F98AA" fill-opacity="0.85"/>
    <polygon points="32,32 36.59,43.09 27.41,43.09" fill="#6F889A" fill-opacity="0.9"/>
    <!-- The flat "table" on top of the gem -->
    <polygon points="30.09,27.38 33.91,27.38 36.62,30.09 36.62,33.91 33.91,36.62 30.09,36.62 27.38,33.91 27.38,30.09"
             fill="#F5F3EF" fill-opacity="0.3"/>
  </g>

  <!-- A sharp highlight -->
  <path d="M26.5 20.5 L27.3 23.2 L30 24 L27.3 24.8 L26.5 27.5 L25.7 24.8 L23 24 L25.7 23.2 Z" fill="#FFFFFF"/>
</svg>
